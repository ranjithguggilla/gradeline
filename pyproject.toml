[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gradeline"
version = "0.1.0"
description = "Ordinal quality grading and tasting-panel triage for wine lots"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ranjith Guggilla" }]
dependencies = [
  "numpy", "pandas", "scipy", "scikit-learn", "matplotlib", "joblib",
  "krippendorff", "scikit-posthocs", "mlxtend", "gradio",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
